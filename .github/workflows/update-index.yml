name: Update marketplace index

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate index.json
        run: |
          python3 -m pip install -r tools/requirements-index.txt
          python3 tools/build_index.py --output index.json --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Commit updated index
        run: |
          git config user.name "mukul975"
          git config user.email "mukul975@users.noreply.github.com"
          git add index.json
          git diff --staged --quiet || git commit -m "chore: auto-update index.json"
          git push
